<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task2Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <main>
    <div class="container">
      <header class="app-header">
        <h1 class="title">Task2Do</h1>
        <p class="subtitle">Stay organized and get things done</p>
      </header>

      <form id="taskForm">
        <input class="taskInput" placeholder="Write a new task..." aria-label="Task name" autocomplete="off" />
        <button type="submit" class="taskCreateBtn">
          <span class="material-icons">add</span>
          <span>Add Task</span>
        </button>
      </form>

      <ul class="taskList"></ul>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>

</html>
